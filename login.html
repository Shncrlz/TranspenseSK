<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSPENSE - Portal Sign In</title>
    <link rel="stylesheet" href="login.css">
    <script>
        if (localStorage.getItem('user')) {
            window.location.replace('dashboard.html');
        }
    </script>
</head>
<body>

    <div class="login-container">
        <div class="login-image-panel">
            <img src="tonsuyahall.jpg" alt="Barangay Tonsuya Hall" onerror="this.src='tonsuyahall.jpg';">
        </div>

        <div class="login-card">
            <div class="login-brand-header">
                <img src="SK_logo.jpg" alt="SK Logo" class="login-brand-logo">
                <div class="login-brand-titles">
                    <h2>TRANSPENSE</h2>
                    <p>Barangay SK Financial Management</p>
                </div>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                    <a class="forgot-link" onclick="switchAuthMode('forgot')">Forgot Password?</a>
                </div>
                <button type="submit" class="btn-submit">Sign In to Portal</button>
            </form>

            <form id="forgotForm" style="display: none;" onsubmit="handleResetWithCode(event)">
                <div class="form-group">
                    <label for="forgotEmail">Email Address</label>
                    <input type="email" id="forgotEmail" placeholder="Enter your registered email" required>
                    <button type="button" class="btn-submit" style="margin-top: 8px; background: #475569;" onclick="requestResetCode()">Get Verification Code</button>
                </div>
                <div class="form-group">
                    <label for="forgotCode">6-Digit Verification Code</label>
                    <input type="text" id="forgotCode" placeholder="Enter code" maxlength="6" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Min 10 chars & 1 uppercase" required>
                </div>
                <button type="submit" class="btn-submit">Reset Password</button>
                <a class="back-link" onclick="switchAuthMode('login')">← Back to Sign In</a>
            </form>

            <div style="text-align: center; margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 15px;">
                <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 5px;">Are you a resident looking for transparency records?</p>
                <a href="transparency.html" style="color: #0284c7; font-weight: 600; font-size: 0.9rem; text-decoration: none;"> View Public Transparency Portal →</a>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
